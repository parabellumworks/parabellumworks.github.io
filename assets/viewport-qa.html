<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Viewport QA</title><style>body{margin:0;padding:16px;background:#ddd;font:16px Arial}button{padding:10px;margin-right:8px}iframe{display:block;border:0;margin-top:16px;width:390px;height:844px;background:#fff}#result{white-space:pre-wrap}</style></head><body><button data-width="320">320</button><button data-width="390">390</button><button data-width="768">768</button><button id="home">Home</button><button id="packages">Packages</button><button id="builder">Builder</button><button id="checkup">Check-up</button><pre id="result"></pre><iframe id="view" src="/" title="Mobile viewport"></iframe><script>const view=document.getElementById('view');document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>view.style.width=b.dataset.width+'px');for(const [id,path] of Object.entries({home:'/',packages:'/paketler/',builder:'/paket-olustur/',checkup:'/check-up/'}))document.getElementById(id).onclick=()=>view.src=path;</script></body></html>
